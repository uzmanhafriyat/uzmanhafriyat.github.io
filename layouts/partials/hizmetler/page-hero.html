<section class="hero-banner">
    <div class="parallax-background">
        <picture>
            <source media="(max-width: 768px)" srcset="{{ .Params.image | relURL }}">
            <img src="{{ .Params.image | relURL }}" alt="{{ .Title }}" loading="eager" fetchpriority="high">
        </picture>
        <div class="parallax-overlay"></div>
        <div class="parallax-content">
            <div class="section-heading">
                <p class="section-subtitle">Ankara Hafriyat ve Altyapı Hizmetleri</p>
                <h1 class="section-title">{{ .Title }}</h1>
            </div>
        </div>
    </div>
</section>

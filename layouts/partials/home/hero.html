<!-- Hero Slider -->
<section class="hero-slider" id="hero-slider">
    <div class="slide-wrapper">
        <div class="slide">
            <picture>
                <source media="(max-width: 768px)"
                    srcset="{{ if .Params.hero_image_mobile }}{{ .Params.hero_image_mobile | relURL }}{{ else }}{{ .Params.hero_image | relURL }}{{ end }}">
                <img src="{{ .Params.hero_image | relURL }}" alt="{{ .Params.hero_title | plainify }}" loading="eager"
                    fetchpriority="high">
            </picture>
        </div>
    </div>

    <div class="caption-wrapper">
        <div class="slide-caption">
            <div class="container">
                <div class="col-sm-12 col-md-10 col-lg-8">
                    <div class="slide-caption-inner">
                        <h1 class="slide-title split-text-once">
                            {{ .Params.hero_title | safeHTML }}
                        </h1>
                        <div class="row">
                            <div class="col-sm-9">
                                <p class="slide-subtitle">
                                    {{ .Params.hero_subtitle | safeHTML }}
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <a href="#about-us-section" class="mouse-symbol">
        <i class="dot-single"></i>
    </a>
</section>
<!-- Hero Slider -->

<section class="mission-vision-one">
    <div class="mission-vision-one__wrapper">
        <div class="hero-msvs-slider embla">
            <div class="embla__container">
                {{ range .Params.mission_vision_block.mission_vision_slides }}
                <div class="embla__slide">
                    <div class="slide-bg" style="background-image:url('{{ .src | relURL }}')"></div>
                </div>
                {{ end }}
            </div>
            <div class="slider-bg-slide-overly"></div>
        </div>
        <div class="mission-vision-one-inner">
            <div class="container">
                <div class="row">
                    <div class="col-12 col-sm-12 col-md-7 col-lg-7 flex flex-row justify-between">
                        <div class="col-12 col-sm-12 col-md-6 col-lg-6">
                            <div class="mission-vision-one-single scroll-reveal-bottom">
                                <div class="msvs-heading">
                                    <div class="icon-box">
                                        <i class="icon-target"></i>
                                    </div>
                                    <h2 class="scroll-reveal-left"> {{ .Params.mission_vision_block.mission_title }} </h2>
                                </div>
                                <p>
                                    {{ .Params.mission_vision_block.mission_content }}
                                </p>
                            </div>
                        </div>

                        <div class="col-12 col-sm-12 col-md-6 col-lg-6">
                            <div class="mission-vision-one-single scroll-reveal-top">
                                <div class="msvs-heading">
                                    <div class="icon-box">
                                        <i class="icon-lightbulb"></i>
                                    </div>
                                    <h2 class="scroll-reveal-left">{{ .Params.mission_vision_block.mission_title }}</h2>
                                </div>
                                <p>
                                    {{ .Params.mission_vision_block.vision_content }}
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

{{ $meta := partial "seo/meta.html" . }}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ $meta.title }}</title>
<meta name="description" content="{{ $meta.description }}">
<meta name="robots" content="{{ if or .Params.noindex (eq .RelPermalink "/pages/") }}noindex, follow{{ else }}index, follow, max-image-preview:large{{ end }}">
<link rel="canonical" href="{{ $meta.url }}">
<meta property="og:title" content="{{ $meta.title }}">
<meta property="og:description" content="{{ $meta.description }}">
<meta property="og:url" content="{{ $meta.url }}">
<meta property="og:type" content="{{ if and .IsPage (eq .Section "blog") }}article{{ else }}website{{ end }}">
<meta property="og:locale" content="tr_TR">
<meta property="og:image" content="{{ $meta.image }}">
<meta property="og:image:alt" content="{{ .Params.image_alt | default .Title }}">
<meta property="og:site_name" content="{{ .Site.Title }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ $meta.title }}">
<meta name="twitter:description" content="{{ $meta.description }}">
<meta name="twitter:image" content="{{ $meta.image }}">
{{ if and .IsPage (eq .Section "blog") }}
<meta property="article:published_time" content="{{ .Date.Format "2006-01-02T15:04:05-07:00" }}">
<meta property="article:modified_time" content="{{ .Lastmod.Format "2006-01-02T15:04:05-07:00" }}">
{{ end }}

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://www.googletagmanager.com">

<meta name="color-scheme" content="light dark">
{{ $css := resources.Match "css/*.css" | resources.Concat "css/main.css" | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">

<link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
<link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="UzmanHaf." />
<link rel="manifest" href="/assets/favicon/site.webmanifest" />

{{ if .Site.Params.googleAnalyticsID }}
<!-- End Google Tag Manager -->
{{ end }}

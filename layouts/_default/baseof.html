<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default " tr" }}" data-theme="light">

<head>
    {{ partial "components/head.html" . }}

    <script type="application/ld+json">
    {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
        {
        "@type": "ListItem",
        "position": 1,
        "name": "Ana Sayfa",
        "item": "{{ .Site.BaseURL }}"
        }
        {{- block "breadcrumb_items" . }}{{ end -}}
    ]
    }
    </script>

    {{ block "extra_schema" . }}{{ end }}
</head>

<body class="{{ if .IsHome }}home-page{{ else }}sub-page{{ end }}">

    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5ZS7XL9N"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    {{ partial "components/header.html" . }}

    {{ block "content" . }}{{ end }}

    {{ partial "components/footer.html" . }}

    {{ $js := resources.Match "js/*.js" | resources.Concat "js/main.js" | fingerprint }}
    <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
</body>
